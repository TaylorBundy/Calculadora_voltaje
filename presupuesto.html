<meta charset="UTF-8">

<link rel="stylesheet" href="css/estilos.css">

</head>


<body>


<div class="app">


<aside class="menu">

<div class="logo">
☀️ SolarPatagonia
</div>


<nav>

<a href="clientes.html">👤 Clientes</a>

</nav>


</aside>



<main class="contenido">


<h1>
📄 Presupuestos
</h1>



<section class="tarjeta">


<h2>
Nuevo presupuesto
</h2>


<label>
Cliente
</label>


<select id="clientePresupuesto">

</select>



<label>
Descripción del sistema
</label>


<textarea id="descripcion">

Sistema solar fotovoltaico residencial

</textarea>




<label>
Paneles
</label>

<input id="paneles"
type="text"
placeholder="Ej: 6 paneles 585W">



<label>
Inversor
</label>

<input id="inversor"
type="text"
placeholder="Ej: Inversor híbrido 5kW">



<label>
Baterías
</label>

<input id="baterias"
type="text"
placeholder="Ej: LiFePO4 10kWh">



<label>
Materiales ($)
</label>

<input id="materiales"
type="number">



<label>
Mano de obra ($)
</label>

<input id="manoObra"
type="number">



<button onclick="guardarPresupuesto()">

💾 Guardar presupuesto

</button>



</section>





<section class="tarjeta">


<h2>
Presupuestos generados
</h2>


<div id="listaPresupuestos">

</div>


</section>



</main>


</div>


<script src="js/almacenamiento.js"></script>
<script src="js/presupuesto.js"></script>


</body>
