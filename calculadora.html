<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora Solar</title>

<link rel="stylesheet" href="css/estilos.css">

</head>


<body>


<div class="app">


<aside class="menu">

<div class="logo">
☀️ SolarPatagonia
</div>


<nav>

<a href="index.html">🏠 Inicio</a>
<a href="clientes.html">👤 Clientes</a>
<a href="calculadora.html">⚡ Calculadora Solar</a>
<a href="presupuesto.html">📄 Presupuestos</a>

</nav>


</aside>



<main class="contenido">


<h1>
⚡ Calculadora Solar
</h1>


<p>
Dimensionamiento inicial de sistemas fotovoltaicos
</p>



<section class="tarjeta">


<h2>
Consumos eléctricos
</h2>


<table id="tablaConsumos">


<thead>

<tr>

<th>Equipo</th>
<th>Cantidad</th>
<th>Potencia W</th>
<th>Horas/día</th>
<th>Eliminar</th>

</tr>

</thead>


<tbody id="listaEquipos">


<tr>

<td>
Heladera
</td>

<td>
<input type="number" value="1">
</td>

<td>
<input class="potencia" type="number" value="120">
</td>

<td>
<input class="horas" type="number" value="10">
</td>

<td>
<button onclick="eliminarFila(this)">
❌
</button>
</td>

</tr>


</tbody>


</table>


<br>


<button onclick="agregarEquipo()">
➕ Agregar equipo
</button>


</section>





<section class="tarjeta">


<h2>
Configuración
</h2>


<label>
Días de autonomía
</label>


<select id="autonomia">

<option value="1">
1 día
</option>

<option value="2">
2 días
</option>

<option value="3">
3 días
</option>

<option value="4">
4 días
</option>

</select>



<br><br>


<label>
Tipo de batería
</label>


<select id="bateria">

<option value="0.5">
AGM / Gel
</option>

<option value="0.8">
Litio LiFePO4
</option>


</select>



<br><br>


<button onclick="calcularSistema()">

🔋 Calcular sistema

</button>


</section>





<section class="tarjeta">


<h2>
Resultado
</h2>


<div id="resultado">

Esperando cálculo...

</div>


</section>



</main>


</div>


<script src="js/calculadora.js"></script>


</body>

</html>
